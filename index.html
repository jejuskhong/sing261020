function home(){const rec=state.visited.length?songs.find(s=>s.id===state.visited.at(-1)):null;app.innerHTML=`<section class="hero"><div><div class="eyebrow">LITTLE SONGS, BIG DISCOVERIES</div><h1>노래 한 소절,<br><em>새로운 세상</em> 한 조각.</h1><p>듣고, 따라 부르고, 단어와 친구가 되어 봐요.<br>우리 아이의 첫 번째 한글·영어 음악 놀이터.</p><div class="hero-buttons"><a class="primary" href="#songs">노래 만나러 가기 &nbsp;↗</a><a class="secondary" href="#words">그림 단어장 &nbsp;＋</a></div></div><div class="hero-art" role="img" aria-label="햇살 아래 함께 노래하는 노란 새와 토끼"><div class="sun">˘ ᴗ ˘</div><div class="cloud"></div><div class="hill"></div><span class="note">♫</span><span class="note two">♪</span><div class="creature"></div><div class="creature buddy"></div><div class="art-caption">오늘도 즐겁게, 랄라라 ♪</div></div></section><div class="journey"><div><span class="step-icon">🎧</span><div><strong>귀 기울여 들어요</strong><p>익숙한 노래로 마음을 열어요</p></div></div><div><span class="step-icon">🌱</span><div><strong>단어와 친해져요</strong><p>그림을 콕! 소리를 들어 봐요</p></div></div><div><span class="step-icon">🎤</span><div><strong>내 목소리로 불러요</strong><p>한 소절씩 천천히, 자신 있게</p></div></div></div>${rec?`<div class="notice">지난번 만난 노래: <button class="text-link" data-song="${rec.id}">${esc(rec.title)} 이어 보기 →</button></div>`:''}<section><div class="section-heading"><div><h2>오늘은 어떤 노래를 만날까요?</h2><p class="sub">작은 호기심을 깨우는 노래를 골라 봐요.</p></div><a class="text-link" href="#songs">전체 60곡 보기 →</a></div>${tabs()}<div class="grid" id="home-grid" style="margin-top:20px">${(filter==='en'?[songs[38],songs[41],songs[30],songs[36]]:filter==='ko'?[songs[1],songs[21],songs[23],songs[0]]:[songs[1],songs[38],songs[41],songs[50]]).map(card).join('')}</div></section><section class="word-banner"><div><div class="eyebrow">A LITTLE WORD, EVERY DAY</div><h2 style="margin:12px 0">그림을 누르면, 단어가 들려요.</h2><p class="sub">보고 듣고 기억하는 나만의 작은 단어장.</p><a class="text-link" href="#words" style="display:inline-block;margin-top:17px">단어 친구 만나기 →</a></div><div class="word-mini"><button class="mini" data-say="star" dat function credit(a){return `<details class="audio-credit"><summary>음원 출처와 무료 이용 조건</summary><p><strong>${esc(a.title)}</strong><br>제작·실연: ${esc(a.author)}<br><a href="${esc(a.source)}" target="_blank" rel="noopener noreferrer">원본 제공 페이지 ↗</a> · <a href="${esc(a.licenseUrl)}" target="_blank" rel="noopener noreferrer">${esc(a.license)}</a>${a.originalSource?'<br><a href="'+esc(a.originalSource)+'" target="_blank" rel="noopener noreferrer">최초 제공 출처 ↗</a>':''}<br>${esc(a.changes)}<br>이용 조건 확인: ${a.checked}. 외부 음원의 실제 재생·청취 검수는 아직 완료하지 못했습니다.${a.license.includes('SA')?'<br>이 음원을 수정하여 배포할 때는 원 라이선스의 동일조건변경허락 요건을 따릅니다.':''}</p></details>`}
function stopPractice(){clearTimeout(practiceTimer);practiceTimer=null;practiceEnd=null;if(audio)audio.pause()}
function attachAudio(){const box=document.getElementById('audio-area');if(!box)return;box.innerHTML=`${audioOrigin==='free'&&FREE_AUDIO[selected.id]?.video?`<video id="audio" controls preload="metadata" playsinline src="${esc(audioUrl)}" style="width:100%;border-radius:15px"></video>`:`<audio id="audio" controls preload="metadata" src="${esc(audioUrl)}"></audio>`}<div class="lesson-actions" style="margin:15px 0"><select id="speed" aria-label="재생 속도"><option value="1">보통 속도</option><option value="0.75">천천히 · 0.75배</option></select>${mode==='practice'?'<select id="chunk" aria-label="연습 구간 길이"><option value="5">5초씩 연습</option><option value="10">10초씩 연습</option></select><button class="primary" id="practice-start">현재 위치부터 연습</button><button class="secondary" id="practice-stop">멈추기</button>':''}</div><p id="practice-status" class="fine" role="status"></p>`;audio=document.getElementById('audio');audio.volume=.65;audio.onpause=()=>{if(practiceEnd!==null){practiceEnd=null;clearTimeout(practiceTimer)}};audio.onerror=()=>{const status=document.getElementById('practice-status');if(status)status.textContent='음원을 불러오지 못했어요. 인터넷 연결과 브라우저 형식 지원을 확인해 주세요.';toast('재생 연결 오류: 출처 페이지나 내 기기 음원으로 이용해 주세요.')};audio.addEventListener('timeupdate',()=>{if(practiceEnd!==null&&audio.currentTime>=practiceEnd){const end=practiceEnd;practiceEnd=null;audio.pause();const el=document.getElementById('practice-status');if(el)el.textContent='이제 내 차례! 방금 들은 부분을 따라 불러 보세요.';practiceTimer=setTimeout(()=>{const e=document.getElementById('practice-status');if(e)e.textContent='잘했어요! 다음 구간을 듣거나 같은 부분을 다시 연습해요.'},(end-window.practiceStart)/audio.playbackRate*1000)}})}
function quiz(){const ws=sets[selected.topic];if(qIndex>=3){state.quizzes++;save();document.getElementById('lesson-body').innerHTML=`<div class="stage"><div class="big">🌟</div><h3>오늘도 한 뼘 자랐어요!</h3><p>단어 소리를 듣고 그림을 골라 봤어요.<br>다음에 또 만나면 더 반가울 거예요.</p><button class="primary" id="quiz-again">한 번 더 해 볼래요</button><a class="text-link" href="#songs" style="margin-top:20px">다른 노래 만나기 →</a></div>`;return}answered=false;quizOrder=[...ws].sort(()=>Math.random()-.5);const target=ws[qIndex%ws.length];document.getElementById('lesson-body').innerHTML=`<div class="stage"><p class="fine">그림 복습 ${qIndex+1} / 3</p><h3>이 단어는 어떤 그림일까요?</h3><button class="primary" id="quiz-sound" style="margin-bottom:20px">🔊 단어 듣기</button><div class="quiz-options">${quizOrder.map((w,i)=>`<button data-answer="${i}" aria-label="그림 ${i+1}: ${esc(w[0])}">${w[2]}</button>`).join('')}</div><p class="feedback" id="feedback" role="status">먼저 단어 소리를 들어 보세요.</p><button class="secondary" id="quiz-next" hidden style="margin-top:16px">다음 그림 →</button></div>`}
function route(){stopPractice();if(audio){audio.pause();audio=null}if('speechSynthesis'in window)speechSynthesis.cancel();const hash=location.hash.slice(1)||'home';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+(hash.startsWith('song/')?'songs':hash)));if(hash.startsWith('song/')){const s=songs.find(s=>s.id===hash.slice(5));if(s){if(!selected||selected.id!==s.id){if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=null;audioOrigin='local';mode=FREE_AUDIO[s.id]?'listen':'words';qIndex=0}lesson(s)}else{location.hash='songs'}}else if(hash==='songs')catalog();else if(hash==='words')wordPage();else home();window.scrollTo(0,0)}
document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-say]');if(!b)return;if(b.dataset.song){location.hash='song/'+b.dataset.song}if(b.hasAttribute('data-back'))location.hash='songs';if(b.dataset.filter){filter=b.dataset.filter;(location.hash==='#songs'?catalog:home)()}if(b.dataset.wordLang){filter=b.dataset.wordLang;wordPage()}if(b.dataset.say){speak(b.dataset.say,b.dataset.lang);if(b.dataset.word&&!state.words.includes(b.dataset.word)){state.words.push(b.dataset.word);save()}}if(b.dataset.mode){stopPractice();mode=b.dataset.mode;qIndex=0;lesson(selected)}if(b.id==='free-play'){stopPractice();if(audioUrl?.startsWith('blob:'))URL.revokeObjectURL(audioUrl);audioUrl=FREE_AUDIO[selected.id].url;audioOrigin='free';attachAudio();try{await audio.play()}catch{toast('음원 연결을 확인해 주세요. 출처 페이지에서도 열 수 있어요.')}}if(b.id==='audio-credits'){showAudioCredits()}if(b.id==='quiz-sound'){const w=sets[selected.topic][qIndex%4];speak(w[selected.lang==='ko'?0:1],selected.lang)}if(b.hasAttribute('data-answer')&&!answered){const correct=quizOrder[Number(b.dataset.answer)][1]===sets[selected.topic][qIndex%4][1];document.getElementById('feedback').textContent=correct?'맞았어요! 멋지게 찾았네요. 🌟':'괜찮아요. 소리를 다시 듣고 골라 볼까요?';if(correct){answered=true;b.style.borderColor='#287455';document.getElementById('quiz-next').hidden=false}}if(b.id==='quiz-next'){qIndex++;quiz()}if(b.id==='quiz-again'){qIndex=0;quiz()}if(b.id==='practice-start'&&audio){stopPractice();if(!Number.isFinite(audio.duration)){toast('음원이 준비된 뒤 다시 눌러 주세요.');return}window.practiceStart=audio.currentTime;practiceEnd=Math.min(audio.duration,audio.currentTime+Number(document.getElementById('chunk').value));document.getElementById('practice-status').textContent='귀 기울여 들어 보세요…';try{await audio.play()}catch{stopPractice();toast('음원을 재생하지 못했어요. 다른 파일을 열어 주세요.')}}if(b.id==='practice-stop'){stopPractice();document.getElementById('practice-status').textContent='잠깐 쉬어 가요.'}if(b.id==='reset-progress'){if(!b.dataset.confirm){b.dataset.confirm='yes';b.textContent='한 번 더 누르면 기록을 지워요';return}state={visited:[],words:[],quizzes:0};save();showParent();toast('이 브라우저의 학습 기록을 지웠어요.')} });
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;results()}});
document.addEventListener('change',e=>{if(e.target.id==='audio-only'){readyOnly=e.target.checked;results()}if(e.target.id==='topic'){topic=e.target.value;results()}if(e.target.id==='word-topic'){topic=e.target.value;wordPage()}if(e.target.id==='speed'&&audio)audio.playbackRate=Number(e.target.value);if(e.target.id==='audio-file'){const f=e.target.files[0];if(!f)return;stopPractice();if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(f);audioOrigin='local';attachAudio();audio.onerror=()=>toast('이 파일 형식을 재생할 수 없어요. MP3 등 다른 음원을 골라 주세요.')}});
function showParent(){document.getElementById('modal-content').innerHTML=`<div class="eyebrow">FOR GROWN-UPS</div><h2 style="margin-top:16px">우리 아이의 작은 발자국</h2><div class="stats"><div class="stat"><strong>${state.visited.length}</strong><span>열어 본 노래</span></div><div class="stat"><strong>${state.words.length}</strong><span>들어 본 단어</span></div><div class="stat"><strong>${state.quizzes}</strong><span>복습 완료 횟수</span></div></div><p>이 기록은 현재 브라우저에 저장돼요. 기기 변경이나 브라우저 데이터 삭제 시 유지되지 않아요. 단어를 눌렀다는 기록과 복습 횟수이며, 실제 노래 실력이나 단어 숙달을 뜻하지 않아요.</p><p><strong>콘텐츠 준비 현황</strong><br>한국어 30곡·영어 30곡 편성 후보를 탐색할 수 있어요. 무료음원은 10개 곡 화면에 연결했어요(한국어 분류 1곡은 피아노 연주, 영어 분류 9곡). 공식 무료 제공 페이지 2곡은 아직 앱 내 재생을 연결하지 못했어요. 나머지 48곡은 음원 준비 중입니다. 그림 단어는 주제 예습 자료입니다. 단어 읽기는 기기의 음성 기능을 사용합니다. 음원 파일을 열면 해당 기기에서만 재생하며 서버로 전송하지 않아요.</p><button class="secondary" id="audio-credits" style="margin-bottom:15px">전체 음원 출처·이용 조건</button><br><button class="danger" id="reset-progress">이 브라우저의 학습 기록 지우기</button>`;const d=document.getElementById('modal');if(!d.open)d.showModal()}
document.getElementById('parent').onclick=showParent;document.getElementById('close-modal').onclick=()=>document.getElementById('modal').close();window.addEventListener('hashchange',route);route();

function showAudioCredits(){document.getElementById('modal-content').innerHTML='<h2>무료음원 출처와 이용 조건</h2><p>재사용 조건을 확인한 외부 자료입니다. 연결 10곡은 서로 다른 음원 파일 9개를 사용하며, 작은 별과 Twinkle은 같은 피아노 연주입니다. 파일을 내려받아 포함한 오프라인 앱은 아닙니다.</p>'+Object.entries(FREE_AUDIO).map(([id,a])=>'<h3 style="font-size:15px;margin-top:22px">'+esc(songs.find(s=>s.id===id).title)+'</h3>'+credit(a)).join('')+'<h3 style="margin-top:25px">공식 자료만 확인한 곡</h3>'+Object.entries(FREE_AUDIO_SOURCES).map(([id,a])=>'<p><a href="'+esc(a.source)+'" target="_blank" rel="noopener noreferrer">'+esc(a.title)+'</a><br>'+esc(a.author)+' · '+esc(a.license)+'<br>앱 내 재생 파일 연결 전</p>').join('');const d=document.getElementById('modal');if(!d.open)d.showModal()}
</script></body></html>
